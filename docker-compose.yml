services:
  # =================================================================
  # Database Layer: PostgreSQL 16 with pgvector Extension
  # =================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sutra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sutra_db}
      POSTGRES_USER: ${DB_USER:-sutra_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sutra_secure_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sutra_admin} -d ${DB_NAME:-sutra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutra-network

  # =================================================================
  # Object Storage Layer: MinIO (S3-Compatible Document Storage)
  # =================================================================
  minio:
    image: minio/minio:latest
    container_name: sutra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sutra_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sutra_minio_secret_key_123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sutra-network

  # =================================================================
  # In-Memory Cache & Event Queue: Valkey (Linux Foundation Open Source)
  # =================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: sutra-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - sutra-network

  # =================================================================
  # Sutra Core API Gateway & Enterprise Services
  # =================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sutra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-sutra_admin}:${DB_PASSWORD:-sutra_secure_pass}@postgres:5432/${DB_NAME:-sutra_db}
      VALKEY_URL: valkey://valkey:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sutra_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-sutra_minio_secret_key_123}
      JWT_SECRET: ${JWT_SECRET:-sutra-enterprise-super-secure-jwt-secret-replace-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_LOCAL_ENDPOINT: http://ollama:11434
    networks:
      - sutra-network

  # =================================================================
  # Sutra Web Console & No-Code Studio UI
  # =================================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: sutra-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - sutra-network

  # =================================================================
  # Optional: Local LLM Engine (Ollama Profile)
  # Run with: docker compose --profile local-ai up
  # =================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: sutra-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sutra-network

volumes:
  postgres_data:
  minio_data:
  valkey_data:
  ollama_data:

networks:
  sutra-network:
    driver: bridge
